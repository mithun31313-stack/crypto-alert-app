# Render "Blueprint" — creates the database + backend + frontend in one go.
# On Render: New + -> Blueprint -> connect this repo -> Render reads this file.
databases:
  - name: crypto-alerts-db
    plan: free
    databaseName: crypto_alerts
    user: crypto

services:
  - type: web
    name: crypto-alert-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-alerts-db
          property: connectionString
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: crypto-alert-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://crypto-alert-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
